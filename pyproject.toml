[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-hygiene-ci-risk-preflight"
version = "0.1.1"
description = "Local no-token scanner for GitHub repository hygiene and CI risk signals."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Repo Hygiene CI Risk Preflight contributors" }]
keywords = ["github-actions", "repository-hygiene", "ci", "devops", "codeowners"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
repo-hygiene-preflight = "repo_hygiene_ci_risk_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
